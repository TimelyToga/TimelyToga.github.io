<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">

    {%- feed_meta -%}

    {% if jekyll.environment == 'production' %}
    {% include google-analytics.html %}
    {% endif %}

    <link rel="icon" href="{{ "/assets/img/logo.svg" | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}{% if page.reading_archive %}?v={{ site.time | date: '%s' }}{% endif %}">
    {% if page.style %}
        <link rel="stylesheet" href="{{ "/assets/css/" | append: page.style | append: ".css" | relative_url }}">
    {% endif %}
</head>
