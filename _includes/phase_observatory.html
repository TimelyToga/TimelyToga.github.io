<aside class="phase-hud" id="phase-hud" aria-label="Background animation controls">
    <div class="phase-hud-capsule">
        <button
            type="button"
            class="phase-bg-toggle-btn"
            id="phase-bg-quick-toggle"
            aria-pressed="true"
            title="Toggle background animation off or on"
        >
            <span class="phase-live-dot" id="phase-live-dot"></span>
            <span class="phase-bg-toggle-text" id="phase-bg-toggle-text">Bg</span>
        </button>

        <input
            type="range"
            class="phase-range-input phase-range-compact"
            id="phase-bg-slider"
            min="0"
            max="100"
            step="1"
            value="78"
            aria-label="Background animation intensity (slide left to turn off)"
            title="Adjust or turn off background animation"
        >

        <span class="phase-capsule-divider" aria-hidden="true"></span>

        <div class="phase-flow-stepper" role="group" aria-label="Cycle background pattern">
            <button type="button" class="phase-step-btn" id="phase-flow-prev" aria-label="Previous pattern" title="Previous pattern">&lsaquo;</button>
            <button type="button" class="phase-flow-index" id="phase-flow-shuffle" aria-label="Random pattern" title="Click for a random pattern">01/07</button>
            <button type="button" class="phase-step-btn" id="phase-flow-next" aria-label="Next pattern" title="Next pattern">&rsaquo;</button>
        </div>
    </div>
</aside>
