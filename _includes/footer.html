<footer class="site-footer">
    <div class="wrapper">
        <div class="footer-content">
            <span class="footer-text">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</span>
            <div class="social-links">
                <a href="https://github.com/{{ site.github_username }}" target="_blank" title="GitHub">
                    {% include social-icon.html name="github" %}
                </a>
                <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" title="LinkedIn">
                    {% include social-icon.html name="linkedin" %}
                </a>
                <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" title="X (Twitter)">
                    {% include social-icon.html name="twitter" %}
                </a>
                <a href="https://www.goodreads.com/user/show/7414236-tim-blumberg" target="_blank" title="Goodreads">
                    {% include social-icon.html name="goodreads" %}
                </a>
            </div>
        </div>
    </div>
</footer>
