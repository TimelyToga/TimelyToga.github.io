<header class="site-header">
    <div class="wrapper">
        <div class="header-content">
            <a class="site-title" href="{{ "/" | relative_url }}">
                <svg class="site-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                    <g transform="rotate(-18 32 32)" fill="none" stroke-linecap="round">
                        <path d="M5 32 A27 9.5 0 0 1 59 32" stroke="currentColor" stroke-width="4" opacity=".55"/>
                        <circle class="site-logo-star" cx="32" cy="32" r="7"/>
                        <path class="site-logo-gap" d="M59 32 A27 9.5 0 0 1 5 32" stroke-width="9" stroke-linecap="butt"/>
                        <path d="M59 32 A27 9.5 0 0 1 5 32" stroke="currentColor" stroke-width="4.6"/>
                    </g>
                </svg>
                <span>{{ site.title }}</span>
            </a>
            <nav class="site-nav" aria-label="Primary">
                <a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} class="active" aria-current="page"{% endif %}>About</a>
                <a href="{{ "/writing/" | relative_url }}"{% if page.url contains "/writing" or page.url contains "/scifi" %} class="active" aria-current="page"{% endif %}>Writing</a>
                <a href="{{ "/reading/" | relative_url }}"{% if page.url contains "/reading" %} class="active" aria-current="page"{% endif %}>Reading</a>
            </nav>
        </div>
    </div>
</header>
