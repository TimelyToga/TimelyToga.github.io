<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-labelledby="dc-emp-title dc-emp-desc">
<title id="dc-emp-title">The Last Emperox — John Scalzi</title>
<desc id="dc-emp-desc">A cracked imperial gold crown on deep purple cloth; luminous currents of the Flow stream up from its points and break apart into beads of light.</desc>
