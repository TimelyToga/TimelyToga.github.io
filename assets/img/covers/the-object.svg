<title id="dc-obj-title">The Object — Joshua T. Calvert</title>
<desc id="dc-obj-desc">On a dark astronomical plate, a hyperbolic trajectory of measured points with error bars leads to an orange reticle around a faint elongated craft firing a braking plume.</desc>
