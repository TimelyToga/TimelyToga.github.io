<linearGradient id="dc-ipo-gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe6a6"/><stop offset="0.45" stop-color="#d1a445"/><stop offset="1" stop-color="#7a5416"/></linearGradient>
