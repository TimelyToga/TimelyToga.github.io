<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-labelledby="dc-dis-title dc-dis-desc">
<title id="dc-dis-title">Distress — Greg Egan</title>
<desc id="dc-dis-desc">A sphere wound from white threads, the world's fabric, unravels on one side; its loose strands fall to a small coral island on a dark Pacific sea.</desc>
