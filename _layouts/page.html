---
layout: default
---
<article class="page-article">
    {% if page.title and page.hide_page_header != true %}
    <header class="page-hero">
        {% if page.eyebrow %}<div class="page-eyebrow">{{ page.eyebrow }}</div>{% endif %}
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.subtitle %}<p class="page-lead">{{ page.subtitle }}</p>{% endif %}
    </header>
    {% endif %}
    {{ content }}
</article>
